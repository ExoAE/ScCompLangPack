name: Update from StarStrings

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-from-starstrings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check StarStrings
        id: check
        run: python3 merge-process/update_pack.py --check

      - name: Release LIVE build
        if: steps.check.outputs.live_status != 'unchanged'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 merge-process/update_pack.py "${{ steps.check.outputs.live_version }}" \
            --add-new --yes \
            --notes "Automatic update to the latest StarStrings version"

      - name: Pre-release PTU build
        if: steps.check.outputs.ptu_status == 'changed' && steps.check.outputs.ptu_version != ''
        run: |
          python3 merge-process/update_pack.py "${{ steps.check.outputs.ptu_version }}" --ptu --add-new
